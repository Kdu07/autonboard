<div class="upload-page">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-brand">
      <div class="nav-brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
        </svg>
      </div>
      Autonboard
    </div>
    <div class="nav-links">
      <a class="nav-link" routerLink="/dashboard">Dashboard</a>
      <a class="nav-link active" routerLink="/upload">Upload</a>
      <a class="nav-link" routerLink="/profile">Profile</a>
      <button class="btn-logout" (click)="logout()">Sign Out</button>
    </div>
  </nav>

  <div class="upload-container">

    <div class="upload-card">
      <div class="upload-card-header">
        <h1 class="upload-title">Upload Files</h1>
        <span class="status-ready">● Ready</span>
      </div>

      <!-- Drop Zone -->
      <div
        class="dropzone"
        [class.dragging]="isDragging"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave()"
        (drop)="onDrop($event)"
        (click)="fileInput.click()"
      >
        <div class="dropzone-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <polyline points="16 16 12 12 8 16"/>
            <line x1="12" y1="12" x2="12" y2="21"/>
            <path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/>
          </svg>
        </div>
        <p class="dropzone-title">Drop your files here</p>
        <p class="dropzone-link">or click to browse</p>
        <p class="dropzone-hint">CSV, XLSX, PDF up to 100MB</p>

        <input
          #fileInput
          type="file"
          multiple
          accept=".csv,.xlsx,.xls,.pdf"
          style="display:none"
          (change)="onFileSelected($event)"
        >
      </div>

      <!-- File List -->
      <div class="file-list" *ngIf="uploadedFiles.length > 0">
        <div class="file-item" *ngFor="let item of uploadedFiles">
          <div class="file-icon-box" [class]="getFileIconClass(item.file.name)">
            {{ getFileIcon(item.file.name) }}
          </div>
          <div class="file-details">
            <div class="file-name">{{ item.file.name }}</div>
            <div class="file-size">{{ formatSize(item.file.size) }}</div>
            <div class="file-progress-bar" *ngIf="item.status === 'uploading'">
              <div class="file-progress-fill" [style.width.%]="item.progress"></div>
            </div>
          </div>
          <div class="file-status">
            <span class="status-check" *ngIf="item.status === 'done'">✓</span>
            <span class="status-error" *ngIf="item.status === 'error'">✗</span>
            <span class="status-pct" *ngIf="item.status === 'uploading'">{{ item.progress }}%</span>
          </div>
        </div>
      </div>

    </div>
  </div>

</div>
