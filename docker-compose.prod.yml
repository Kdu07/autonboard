version: '3.8'

services:
  database:
    image: postgres:16-alpine
    container_name: g01-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-g01_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_prod:/var/lib/postgresql/data
      - ./src/database/runDB/01_create_database.sql:/docker-entrypoint-initdb.d/01_create_database.sql
      - ./src/database/runDB/02_initial_data.sql:/docker-entrypoint-initdb.d/02_initial_data.sql
    networks:
      - app-prod
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_DATABASE:-g01_db}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Memory limit for 128MB total constraint
    mem_limit: 80m
    memswap_limit: 80m
    cpus: '0.25'

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.prod
    container_name: g01-backend
    environment:
      NODE_ENV: production
      DB_USER: ${DB_USER:-postgres}
      DB_HOST: database
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-g01_db}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_SSL: ${DB_SSL:-false}
    ports:
      - "3000:3000"
    volumes:
      - ./src/uploads:/app/src/uploads
    networks:
      - app-prod
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 10s
    # Memory limit for 128MB total constraint
    mem_limit: 32m
    memswap_limit: 32m
    cpus: '0.2'

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.prod
    container_name: g01-frontend
    ports:
      - "80:80"
    networks:
      - app-prod
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 10s
    # Memory limit for 128MB total constraint
    mem_limit: 16m
    memswap_limit: 16m
    cpus: '0.05'

volumes:
  postgres_prod:
    driver: local

networks:
  app-prod:
    driver: bridge
