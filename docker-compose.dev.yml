version: '3.8'

services:
  database:
    image: postgres:16-alpine
    container_name: g01-db-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: g01_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data
      - ./src/database/runDB/01_create_database.sql:/docker-entrypoint-initdb.d/01_create_database.sql
      - ./src/database/runDB/02_initial_data.sql:/docker-entrypoint-initdb.d/02_initial_data.sql
    networks:
      - app-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d g01_db"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.dev
    container_name: g01-backend-dev
    environment:
      NODE_ENV: development
      DB_USER: postgres
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: g01_db
      DB_PASSWORD: postgres
      DB_SSL: 'false'
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./app.ts:/app/app.ts
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules
      - ./src/uploads:/app/src/uploads
    networks:
      - app-dev
    depends_on:
      database:
        condition: service_healthy
    command: npm run dev

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    container_name: g01-frontend-dev
    ports:
      - "4200:4200"
    volumes:
      - ./src/frontend/src:/app/src
      - ./src/frontend/angular.json:/app/angular.json
      - ./src/frontend/tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    networks:
      - app-dev
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:3000

volumes:
  postgres_dev:
    driver: local

networks:
  app-dev:
    driver: bridge
