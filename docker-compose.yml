version: '3.8'

services:
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: g01_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=database
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=g01_db
      - DB_PORT=5432
    depends_on:
      - database
    # Mapeamento de volume para que mudanças locais reflitam direto no container (Hot-reload)
    volumes:
      - .:/app
      - /app/node_modules

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    depends_on:
      - backend
    # Mapeamento de volume para recarregar o Angular a cada save
    volumes:
      - ./src/frontend:/app
      - /app/node_modules

volumes:
  pgdata:
